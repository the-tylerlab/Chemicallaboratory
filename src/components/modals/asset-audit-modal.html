  <div id="assetAuditModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 520px;">
      <div class="modal-header">
        <h3 id="assetAuditModalTitle">บันทึกผลการตรวจนับครุภัณฑ์</h3>
        <button class="modal-close" onclick="closeAssetAuditModal()"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" style="padding: 20px;">
        <input type="hidden" id="auditAssetCode">
        
        <div style="background: #f8fafc; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #e2e8f0;">
          <div style="font-size: 13px; color: var(--text-muted);">รหัสครุภัณฑ์: <strong id="auditAssetCodeDisplay" style="color: var(--primary-purple);"></strong></div>
          <div style="font-size: 15px; font-weight: 600; color: var(--text-main); margin-top: 4px;" id="auditAssetNameDisplay"></div>
          <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;" id="auditAssetLocationDisplay"></div>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">สภาพความพร้อมใช้งาน <span class="required">*</span></label>
          <select id="auditAssetCondition" class="form-control" style="width: 100%; height: 38px;">
            <option value="normal">ใช้งานได้ตามปกติ (100%)</option>
            <option value="minor_issue">มีตำหนิเล็กน้อย แต่ยังใช้งานได้</option>
            <option value="repair">ชำรุด - อยู่ระหว่างส่งซ่อม</option>
            <option value="damaged">ชำรุดใช้งานไม่ได้ (รอจำหน่ายออก)</option>
          </select>
        </div>

        <div class="form-row-multi" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div class="form-group">
            <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">จำนวนในบัญชี</label>
            <input type="number" id="auditAssetBookQty" readonly style="width: 100%; height: 38px; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 10px;">
          </div>
          <div class="form-group">
            <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">จำนวนที่นับได้จริง <span class="required">*</span></label>
            <input type="number" id="auditAssetActualQty" min="0" data-rolling-counter style="width: 100%; height: 38px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 10px;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">รอบปีงบประมาณที่ตรวจนับ</label>
          <input type="text" id="auditAssetFiscalYear" style="width: 100%; height: 38px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 10px;" value="2569">
        </div>

        <div class="form-group" style="margin-bottom: 18px;">
          <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">หมายเหตุ / บันทึกเพิ่มเติม</label>
          <textarea id="auditAssetNotes" rows="2" class="form-control" style="width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #cbd5e1;" placeholder="เช่น แบตเตอรี่เสื่อมสภาพ, อุปกรณ์ครบชุด"></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="closeAssetAuditModal()" style="padding: 9px 18px;">ยกเลิก</button>
          <button type="button" class="btn btn-primary" onclick="saveAssetAuditRecord()" style="padding: 9px 18px; background-color: var(--primary-purple); color: white; border: none; font-weight: 600; cursor: pointer;">บันทึกผลการตรวจนับ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
