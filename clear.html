<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing System Cache...</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8fafc; margin: 0; flex-direction: column; }
        .loader { border: 4px solid #e2e8f0; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2 style="color: #334155;">กำลังรีเซ็ตและล้างแคชของระบบ...</h2>
    <p style="color: #64748b;">กรุณารอสักครู่ ระบบจะพากลับไปยังหน้าหลักโดยอัตโนมัติ</p>

    <script>
        // ล้างสถานะว่าเคยใส่ mock data หรือยัง เพื่อให้สร้างใหม่
        localStorage.removeItem("full_mock_v1");
        
        // ลบ Service Worker ทั้งหมด
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
                
                // รอให้ Unregister เสร็จแล้วเปลี่ยนหน้า
                setTimeout(() => {
                    window.location.replace('index.html?nocache=' + Date.now());
                }, 1500);
            }).catch(function(err) {
                window.location.replace('index.html?nocache=' + Date.now());
            });
        } else {
            setTimeout(() => {
                window.location.replace('index.html?nocache=' + Date.now());
            }, 1500);
        }
    </script>
</body>
</html>
