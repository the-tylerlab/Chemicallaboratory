name: Security & Test Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit & Mock Specification Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run In-Memory Unit & Fail-Closed Scenarios
        run: npm run test:unit

  security-tests:
    name: Core Security, RBAC & Headers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Security Suite
        run: npm run test:security
      - name: Run RBAC Authorization Tests
        run: npm run test:rbac
      - name: Run HTTP Headers & CORS Tests
        run: npm run test:headers
      - name: Run Auth Domain Tests
        run: npm run test:auth
      - name: Run Security Contract Checks
        run: npm run test:security-contract

  data-integrity:
    name: Data Integrity & Backup Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Verify Unique Constraints & Key Invariants
        run: npm run verify:data
      - name: Verify Backup & Non-Destructive Restore Drill
        run: node scripts/data/verify_backup_and_restore.js

  build-check:
    name: Build & Asset Compilation Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Pages & Bundles
        run: npm run build

  # Secrets are never made available to pull_request code. Staging verification
  # runs only after trusted code is pushed to main and still uses staging creds.
  staging-integration:
    name: Supabase Staging Live Integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Live Staging Integration Test
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          REQUIRE_STAGING: "true"
        run: node tests/test_supabase_staging_integration.js

  test-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, security-tests, data-integrity, build-check, staging-integration]
    if: always()
    steps:
      - name: Evaluate Results
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          SECURITY_RESULT: ${{ needs.security-tests.result }}
          DATA_RESULT: ${{ needs.data-integrity.result }}
          BUILD_RESULT: ${{ needs.build-check.result }}
          STAGING_RESULT: ${{ needs.staging-integration.result }}
        run: |
          printf 'Unit Tests:          %s\n' "$UNIT_RESULT"
          printf 'Security Tests:      %s\n' "$SECURITY_RESULT"
          printf 'Data Integrity:      %s\n' "$DATA_RESULT"
          printf 'Build Compilation:   %s\n' "$BUILD_RESULT"
          printf 'Staging Integration: %s\n' "$STAGING_RESULT"
          for result in "$UNIT_RESULT" "$SECURITY_RESULT" "$DATA_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Quality gate failed."
              exit 1
            fi
          done
          if [[ "$STAGING_RESULT" != "success" && "$STAGING_RESULT" != "skipped" ]]; then
            echo "Staging integration failed."
            exit 1
          fi
          echo "Quality gate passed."
